# =============================================================================
# Quartz Build Configuration
# =============================================================================
# This file contains build-time configuration options for the Quartz runtime.
# Edit these values and run ./build.sh to rebuild with new settings.

# =============================================================================
# Build Type
# =============================================================================
# Options: Debug, Release, RelWithDebInfo
BUILD_TYPE=Release

# =============================================================================
# JIT Compiler Configuration
# =============================================================================
# Enable Copy-and-Patch JIT compilation
# When enabled, hot functions will be compiled to native code at runtime
JIT_ENABLED=true

# JIT compilation threshold (number of calls before compiling)
# Lower = more aggressive JIT, higher startup cost
# Higher = less compilation, faster startup, slower peak performance
JIT_THRESHOLD=100

# Enable JIT debug output (prints compilation info)
JIT_DEBUG=false

# =============================================================================
# Optimization Levels
# =============================================================================
# Enable Link-Time Optimization (LTO) for better cross-module optimization
LTO_ENABLED=true

# Enable Profile-Guided Optimization (requires two-pass build)
PGO_ENABLED=false

# Enable CPU-specific optimizations (less portable but faster)
NATIVE_ARCH=false

# =============================================================================
# Extensions Configuration
# =============================================================================
# List of extensions to build (comma-separated)
# Available: system_io, system_collection, system_runtime, system_net_socket,
#            system_async_eventloop, system_async_task, system_net_uwsgi,
#            system_fs, system_json, system_math, system_string, system_time,
#            system_convert, system_error, system_io_buffer, system_net_http
EXTENSIONS=system_io,system_collection,system_runtime,system_net_socket,system_async_eventloop,system_net_uwsgi

# =============================================================================
# VM Configuration
# =============================================================================
# Default stack size for VM (number of Value slots)
VM_STACK_SIZE=65536

# Enable VM debug tracing (very verbose, for development only)
VM_DEBUG_TRACE=false

# Enable instruction metadata caching for hot functions
VM_INSTRUCTION_CACHE=true

# Enable computed gotos for instruction dispatch (GCC/Clang only)
QZ_VM_COMPUTED_GOTOS=true

# =============================================================================
# Memory Configuration
# =============================================================================
# Initial heap size in MB
HEAP_INITIAL_MB=64

# Maximum heap size in MB (0 = unlimited)
HEAP_MAX_MB=0

# =============================================================================
# Platform-Specific Options
# =============================================================================
# Force specific platform (auto-detected if empty)
# Options: linux, macos, windows
PLATFORM=

# Force specific architecture for JIT stencils (auto-detected if empty)
# Options: x86_64, aarch64
ARCH=

# =============================================================================
# Build Paths
# =============================================================================
# Output directory for build artifacts
BUILD_DIR=build

# Installation prefix
INSTALL_PREFIX=/usr/local
